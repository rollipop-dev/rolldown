name: PR Dev Release

permissions: {}

on:
  pull_request_target:
    branches: [main]
    types: [labeled, synchronize]

jobs:
  dispatch:
    if: >-
      github.repository == 'rollipop-dev/rolldown' &&
      github.event.pull_request.state == 'open' &&
      ((github.event.action == 'labeled' && github.event.label.name == 'prerelease') ||
       (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'prerelease')))
    name: Prepare PR dev release
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: write # create the temporary release branch
      actions: write # dispatch the existing trusted publisher workflow
      pull-requests: read # find who enabled prereleases on the PR
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.sha }}
      DEV_BRANCH: prerelease-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      # The label authorizes the current PR commit and subsequent updates, including forks.
      # Check the label author's access rather than the author of a later push.
      - name: Check trigger permission
        env:
          ACTOR: ${{ github.actor }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          if [ "$EVENT_ACTION" = 'synchronize' ]; then
            ACTOR=$(gh api --paginate --slurp "repos/${GH_REPO}/issues/${PR_NUMBER}/events?per_page=100" \
              --jq '[.[][] | select((.event == "labeled" or .event == "unlabeled") and .label.name == "prerelease")] | max_by(.id) | select(.event == "labeled") | .actor.login // empty')
          fi
          if [ -z "$ACTOR" ]; then
            echo '::error::No active prerelease label author was found.'
            exit 1
          fi
          permission=$(gh api "repos/${GH_REPO}/collaborators/${ACTOR}/permission" --jq .permission)
          case "$permission" in
            admin|maintain|write) ;;
            *)
              echo '::error::The prerelease label must be added by someone with write access.'
              exit 1
              ;;
          esac

      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      # Only Git operations run here; PR build scripts run in the dispatched workflow.
      - name: Prepare release branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config core.hooksPath /dev/null
          git fetch --no-tags --unshallow origin "$BASE_SHA" "$PR_SHA"
          git switch -c "$DEV_BRANCH" "$BASE_SHA"
          git merge --no-ff --no-commit "$PR_SHA"

          # Use main's workflows even when the PR changes CI definitions.
          git restore --source="$BASE_SHA" --staged --worktree -- .github
          git commit --allow-empty -m "ci: prepare dev release for PR #${PR_NUMBER}"
          gh auth setup-git
          git push origin "HEAD:refs/heads/$DEV_BRANCH"

      - name: Trigger dev release
        run: |
          current_sha=$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}" \
            --jq 'select(.state == "open" and any(.labels[]; .name == "prerelease")) | .head.sha')
          if [ "$current_sha" != "$PR_SHA" ]; then
            echo 'Skipping release: the PR changed or prereleases were disabled.'
            exit 0
          fi
          gh workflow run publish-to-npm.yml --ref "$DEV_BRANCH" --field dev=true --field pr="$PR_NUMBER"
          {
            echo "Dev release requested for PR #${PR_NUMBER} at \`${PR_SHA}\`."
            echo
            echo "[Release branch](https://github.com/${GH_REPO}/tree/${DEV_BRANCH})"
            echo
            echo "[Publish workflow](https://github.com/${GH_REPO}/actions/workflows/publish-to-npm.yml)"
          } >> "$GITHUB_STEP_SUMMARY"
