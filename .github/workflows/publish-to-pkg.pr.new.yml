name: Publish to pkg.pr.new
description: https://pkg.pr.new/~/rollipop-dev/rolldown

permissions: {}

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authorize:
    name: Authorize preview trigger
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.permission.outputs.allowed }}
    steps:
      - name: Check trigger permission
        id: permission
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          LABEL_NAME: ${{ github.event.label.name }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${EVENT_NAME}" != "pull_request" ] || [ "${LABEL_NAME}" != "trigger: preview" ]; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          permission=$(gh api "repos/${REPOSITORY}/collaborators/${ACTOR}/permission" --jq .permission 2>/dev/null || echo none)
          case "${permission}" in
            admin|maintain|write)
              echo "allowed=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "allowed=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

  build:
    name: Build bindings and node packages
    if: github.repository == 'rollipop-dev/rolldown' && needs.authorize.outputs.allowed == 'true'
    needs: authorize
    uses: ./.github/workflows/reusable-release-build.yml
    with:
      version: 'commit'

  publish:
    if: github.repository == 'rollipop-dev/rolldown' && needs.authorize.outputs.allowed == 'true'
    name: Pkg Preview
    runs-on: ubuntu-latest
    needs:
      - authorize
      - build
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          version: '1.0.0'
          cache: true

      - name: Git Reset Hard
        run: git reset --hard # fix pnpm install add new line for package.json

      - name: Download Binding Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: packages/rolldown/artifacts
          pattern: bindings-*

      - name: Create rolldown/npm dirs
        run: vp exec --filter '@rollipop/rolldown' napi create-npm-dirs

      - name: Move Binding Artifacts
        run: vp run --filter '@rollipop/rolldown' artifacts

      - name: List Rolldown Bindings
        run: ls -R ./packages/rolldown/npm
        shell: bash

      - name: Download Node Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: packages/rolldown/dist
          name: node-artifact

      - name: Download `@rollipop/rolldown-debug` Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: packages/debug/dist
          name: debug-artifact

      - name: Download `rolldown-version.txt`
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rolldown-version

      - name: Commit Versioning
        run: |
          ROLLDOWN_VERSION=$(cat rolldown-version.txt)
          node --import @oxc-node/core/register ./scripts/misc/bump-version.js ${ROLLDOWN_VERSION}
          vp run --filter '@rollipop/rolldown' prepublishOnly --skip-optional-publish

      - name: Copy Licenses
        run: |
          find ./packages/ -type d -maxdepth 1 -exec cp LICENSE {} \;
          find ./packages/ -type d -maxdepth 1 -exec cp THIRD-PARTY-LICENSE {} \;

      - name: Release
        run: vpx pkg-pr-new publish --compact --pnpm './packages/rolldown/npm/*' './packages/rolldown' './packages/debug' --packageManager=pnpm,npm,yarn --commentWithDev
