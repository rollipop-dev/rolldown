name: Publish Dev to NPM

# Called by publish-to-npm.yml to reuse its existing npm trusted publisher.
permissions: {}

on:
  workflow_call:
    outputs:
      version:
        description: Published dev version
        value: ${{ jobs.publish.outputs.version }}

jobs:
  build:
    if: github.repository == 'rollipop-dev/rolldown'
    name: Build bindings and node packages
    uses: ./.github/workflows/reusable-release-build.yml

  publish:
    needs: build
    if: github.repository == 'rollipop-dev/rolldown'
    name: Publish dev npm packages
    runs-on: ubuntu-latest
    environment: release
    outputs:
      version: ${{ steps.version.outputs.version }}
    permissions:
      id-token: write # for npm trusted publishing
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
        with:
          restore-cache: false
          save-cache: false

      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          version: '1.0.0'
          cache: true

      - name: Set dev version
        id: version
        run: |
          version="0.0.0-dev-$(date -u +%Y%m%d%H%M%S)"
          node --import @oxc-node/core/register ./scripts/misc/bump-version.js "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build dev node package
        # Rebuild after versioning so the generated loader checks the dev version.
        # This keeps the shared release workflow unchanged; its native release
        # artifacts are reused, while its node-artifact is not published here.
        env:
          RELEASING: 'true'
        run: |
          vp run --filter '@rollipop/rolldown' build-binding
          vp run --filter '@rollipop/rolldown' build-node

      - name: Download Binding Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: packages/rolldown/artifacts
          pattern: bindings-*

      - name: Create rolldown/npm dirs
        run: vp exec --filter '@rollipop/rolldown' napi create-npm-dirs

      - name: Move Binding Artifacts
        run: vp run --filter '@rollipop/rolldown' artifacts

      - name: Download debug artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: packages/debug/dist
          name: debug-artifact

      - name: Copy Licenses
        run: |
          find ./packages/ -type d -maxdepth 1 -exec cp LICENSE {} \;
          find ./packages/ -type d -maxdepth 1 -exec cp THIRD-PARTY-LICENSE {} \;

      - name: Install npm
        # npm 12 requires a newer Node than the pinned 24.12.0.
        run: npm install -g "npm@^11"

      - name: Publish (dry run)
        env:
          NAPI_DRY_RUN: '1'
          ROLLDOWN_NAPI_PREPUBLISH_DRY_RUN: 'true'
          npm_config_tag: dev
        run: vp pm publish -r --tag dev --dry-run --no-git-checks --filter '!@rolldown/browser'

      - name: Publish
        env:
          # napi pre-publish invokes npm publish for each native binding package.
          npm_config_tag: dev
        run: vp pm publish -r --tag dev --no-git-checks --filter '!@rolldown/browser'
